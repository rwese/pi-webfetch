<article>
  <p>
    The exact ratio is called
    <span class="mwe-math-mathml-inline mwe-math-mathml-display" style="display: inline-block;">
      <math xmlns="http://www.w3.org/1998/Math/MathML" alttext="\pi ={\frac {C}{d}}">
        <semantics>
          <mrow>...MathML...</mrow>
          <annotation encoding="TeX">\pi ={\frac {C}{d}}</annotation>
        </semantics>
      </math>
      <img alt="{\displaystyle \pi ={\frac {C}{d}}.}"
           src="https://wikimedia.org/api/rest_v1/media/math/render/svg/f98a23e73a342246e95838018afd6f157a859564"
           aria-hidden="true" />
      <span style="display: none;">{\displaystyle \pi ={\frac {C}{d}}.}</span>
    </span>
    . In Euclidean geometry the ratio
    <span class="mwe-math-mathml-inline" style="display: inline-block;">
      <math xmlns="http://www.w3.org/1998/Math/MathML" alttext="\frac{C}{d}">
        <semantics>
          <mrow>...MathML...</mrow>
          <annotation encoding="TeX">\frac{C}{d}</annotation>
        </semantics>
      </math>
      <img alt="{\textstyle {\frac {C}{d}}}"
           src="https://wikimedia.org/api/rest_v1/media/math/render/svg/c8ebfc4cd5de67be49da2841f490d1d55053a1c4"
           aria-hidden="true" />
      <span style="display: none;">{\textstyle {\frac {C}{d}}}</span>
    </span>
    is constant, regardless of the circle's size.
  </p>
</article>
